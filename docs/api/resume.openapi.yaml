openapi: 3.0.3
info:
  title: AJAS Resume Management API
  version: "1.0.0"
  description: >
    Upload, parse, edit, preview, and select resumes. Auth is
    `Authorization: Bearer <user-id>` in `AUTH_MODE=dev`.
servers:
  - url: http://localhost:7071/api
paths:
  /resumes:
    post:
      summary: Upload a PDF or DOCX resume
      operationId: uploadResume
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Resume created and parse job enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [uploaded] }
        "400": { description: Encrypted, corrupt, empty, or AV rejected }
        "413": { description: File too large }
        "415": { description: Unsupported MIME type }
        "429": { description: Rate limited }
    get:
      summary: List the caller's resumes
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Paginated library
  /resumes/upload:
    post:
      summary: Alias of POST /resumes
      security:
        - bearerAuth: []
      responses:
        "201": { description: Same as POST /resumes }
  /resumes/active:
    get:
      summary: Get the one-active-per-user default resume
      security:
        - bearerAuth: []
      responses:
        "200": { description: Resume detail }
        "404": { description: No active resume }
  /resumes/{id}:
    get:
      summary: Resume metadata and parsed fields
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200": { description: Resume detail }
        "404": { description: Not found or not owned }
    patch:
      summary: Edit parsed fields
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParsedPatch"
      responses:
        "200": { description: Updated resume }
        "400": { description: Validation error with JSON pointer paths }
    delete:
      summary: Soft-delete a resume
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "204": { description: Deleted (idempotent) }
  /resumes/{id}/parsed:
    patch:
      summary: Alias of PATCH /resumes/{id}
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200": { description: Updated resume }
  /resumes/{id}/preview-url:
    get:
      summary: Short-lived read-only SAS URL (10 minutes)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: SAS URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresInSeconds: { type: integer, example: 600 }
  /resumes/{id}/audit:
    get:
      summary: Read-only field edit and parse audit trail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: Newest-first events with old/new values on edits
  /resumes/{id}/active:
    put:
      summary: Set this resume as the user's single active resume
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200": { description: Resume now isActive }
        "400": { description: Deleted or not selectable }
  /resumes/{id}/retry-parse:
    post:
      summary: Re-enqueue parsing
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200": { description: Status reset to uploaded }
  /runs/{runId}/active-resume:
    post:
      summary: Set the active resume for an apply run
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resumeId]
              properties:
                resumeId: { type: string }
      responses:
        "200": { description: Selection }
    get:
      summary: Get the active resume for a run
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Selection }
        "404": { description: None }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ResumeId:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    ParsedPatch:
      type: object
      properties:
        skills:
          type: array
          items: { type: string }
        experience:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              company: { type: string }
              startDate: { type: string }
              endDate: { type: string }
              isCurrent: { type: boolean }
              description: { type: string }
        education:
          type: array
          items:
            type: object
            properties:
              institution: { type: string }
              degree: { type: string }
              field: { type: string }
              startDate: { type: string }
              endDate: { type: string }
        contact:
          type: object
          properties:
            fullName: { type: string }
            email: { type: string }
            phone: { type: string }
            location: { type: string }
            linkedinUrl: { type: string }
