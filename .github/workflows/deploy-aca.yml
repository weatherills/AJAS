name: Deploy Container Apps

on:
  workflow_dispatch:
    inputs:
      image:
        description: Container image (registry/app:tag)
        required: true
      resource_group:
        description: Azure resource group
        required: true
      container_app:
        description: Container App name
        required: true

# Intentionally not on pull_request. Production deploy is operator-triggered.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ inputs.container_app }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --image "${{ inputs.image }}"
      - name: Smoke probes
        env:
          AJAS_BASE_URL: ${{ secrets.AJAS_BASE_URL }}
        run: |
          if [ -z "$AJAS_BASE_URL" ]; then
            echo "AJAS_BASE_URL secret not set; skip live smoke"
            exit 0
          fi
          python scripts/smoke.py
